# IRIS3 Configuration for Yan 2013 Human Embryo Data
# Dataset: Single-cell RNA-seq of human preimplantation embryos
# Reference: Yan et al., Nature Structural & Molecular Biology, 2013

input:
  # Expression matrix (genes x cells)
  expression_file: "data/Yan_2013_expression.csv"
  expression_format: "auto"
  delimiter: ","
  # Cell type labels
  label_file: "data/Yan_2013_label.csv"
  label_delimiter: ","
  # Optional: Custom gene modules
  gene_module_file: null

# Species (Human or Mouse)
species: "Human"

preprocessing:
  # Seurat clustering resolution (not used when labels provided)
  resolution_seurat: 0.8
  # Number of principal components
  n_pcs: 10
  # Number of highly variable features
  n_variable_features: 2000
  # Enable DrImpute imputation
  enable_imputation: false
  # Remove ribosomal genes
  remove_ribosome: false
  # Enable trajectory analysis
  enable_trajectory: false
  # Use provided labels instead of Seurat clustering
  use_provided_labels: true

biclustering:
  # QUBIC2 parameters
  k: 15
  q: 0.06
  f: 0.7
  o: 200
  enable_continuous: false

motif:
  # Promoter region length (bp upstream of TSS)
  promoter_length: 1000
  min_motif_length: 12
  max_motif_length: 12
  use_meme: true
  num_motifs: 3

execution:
  threads: 8
  checkpoint_interval: 1
